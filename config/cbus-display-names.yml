# Controls how C-Bus device names appear on the controller screens.
# Device names are split on "_" (or spaces); each word is looked up below
# (case-insensitive). Unknown words are shown as-is.

# Leading words removed from the display name (the floor prefix).
strip_prefixes: ["G", "1", "OUTSIDE", "V"]

words:
  DIN: Dining
  LNG: Lounge
  HL: Hallway
  PTY: Pantry
  KTCH: Kitchen
  SIT: Sitting Room
  ENS: Ensuite
  TLT: Toilet
  WIR: Walk-in-Robe
  BTH: Bathroom
  AC: AirDuct
  ALCOVE: Alcove
  BCNY: Balcony
  ENT: Entry
  EQUIP: Equipment
  GARAGE: Garage
  LNDRY: Laundry
  RMPS: Rumpus
  STDY: Study
  STR: Stair
  WRK: Store Room
  OUT: Outside
  L: Light
  LIGHT: Light
  UPLIGHT: Uplight
  W: West
  E: East
  N: North
  C: Centre
  S: Shutter
  B: Blind
  El: East Left
  Er: East Right
  Nl: North Left
  Nr: North Right
  Sr: South
  Wl: West Left
  Wc: West Centre
  Wr: West Right


# Regex patterns for words with a number, e.g. BD2 -> Bedroom 2.
patterns:
  '^BD(\d+)$': 'Bedroom \1'
  '^N(\d+)$': 'North \1'
  '^E(\d+)$': 'East \1'
  '^S(\d+)$': 'South \1'
  '^W(\d+)$': 'West \1'
  '^C(\d+)$': 'Centre \1'

# Force a device onto a floor (Ground or First) by its C-Bus name.
# Needed for devices whose C-Bus name has the wrong floor prefix.
# Once renamed in C-Bus to "1 BCNY L W" this entry is no longer required.
floor_overrides:
  G_BCNY_L_W: First

# Complete replacement of the display text for a specific device name.
# Takes priority over words/patterns.
name_overrides: {}

# Background colour by device type. The type is the third word of the C-Bus
# name (e.g. G_KTCH_L -> L). Names with any other type use "other".
type_colors:
  L: "#ADD8E6"      # lights: light blue
  LIGHT: "#ADD8E6"
  UPLIGHT: "#ADD8E6"
  B: "#D3D3D3"      # blinds: light gray
  S: "#BEBEBE"      # shutters: slightly darker light gray
  other: "#FFFFE0"  # everything else: light yellow
