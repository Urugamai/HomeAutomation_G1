# Configure after commissioning the thermostat in the local Matter Server.
enabled: true
matter-server-url: ws://127.0.0.1:5580/ws
node-id: 1
endpoint-id: 1
fan-endpoint-id: 2
fan-control-enabled: true
active-heating-setpoint-c: 25.0
active-cooling-setpoint-c: 21.0

# Written to the thermostat whenever the Pi commands OFF, so the thermostat's own
# setpoints stay in a comfortable band if it is later left running without the Pi.
safe-heating-setpoint-c: 20.0
safe-cooling-setpoint-c: 25.0

# Publish the thermostat's own room temperature as an environment source.
publish-temperature: true
temperature-poll-seconds: 60
room-name: Thermostat
