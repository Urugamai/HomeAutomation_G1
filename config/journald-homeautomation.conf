# Install on the Pi:
#   sudo mkdir -p /etc/systemd/journald.conf.d /var/log/journal
#   sudo cp ~/HomeAutomation_G1/config/journald-homeautomation.conf /etc/systemd/journald.conf.d/homeautomation.conf
#   sudo systemctl restart systemd-journald
[Journal]
# Keep logs on disk across reboots instead of in RAM.
Storage=persistent
SystemMaxUse=500M
MaxRetentionSec=1month
# Don't drop bursts of messages from chatty daemons.
RateLimitIntervalSec=0
RateLimitBurst=0
